name: Build Invoice Maker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/invoicemaker/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp index.html app/src/main/assets/index.html

          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("Never Forget", "Invoice Maker")
          s = s.replace('const APP_VERSION="3.0.0";', 'const APP_VERSION="3.2.1 APK";')
          s = s.replace('const APP_VERSION="3.1.0 APK";', 'const APP_VERSION="3.2.1 APK";')
          s = s.replace('const APP_VERSION="3.2.0";', 'const APP_VERSION="3.2.1 APK";')
          old = ''' const w=window.open("","_blank");if(!w){alert("Allow pop-ups for this site and try again.");return}w.document.open();w.document.write(out);w.document.close();w.focus();setTimeout(()=>{try{w.print()}catch(e){}},500)
          }'''
          new = ''' if(window.Android && typeof Android.printHtml==="function"){Android.printHtml(out);return}
           const w=window.open("","_blank");if(!w){alert("Allow pop-ups for this site and try again.");return}w.document.open();w.document.write(out);w.document.close();w.focus();setTimeout(()=>{try{w.print()}catch(e){}},500)
          }'''
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          PY

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "InvoiceMaker"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.invoicemaker.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.invoicemaker.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 33
                  versionName "3.2.1"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#111827</item>
                  <item name="android:navigationBarColor">#111827</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#111827"
                  android:pathData="M0,0h108v108h-108z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M27,24h54v60h-54z" />

              <path
                  android:fillColor="#111827"
                  android:pathData="M35,35h38v6h-38zM35,48h38v6h-38zM35,61h25v6h-25z" />
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Invoice Maker"
                  android:icon="@drawable/app_icon"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/invoicemaker/app/MainActivity.java <<'EOF'
          package com.invoicemaker.app;

          import android.app.Activity;
          import android.app.PrintManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.addJavascriptInterface(
                      new AndroidBridge(),
                      "Android"
                  );

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> newCallback,
                              FileChooserParams params) {

                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = newCallback;

                          try {
                              startActivityForResult(
                                  params.createIntent(),
                                  FILE_REQUEST
                              );
                              return true;
                          } catch (Exception e) {
                              fileCallback = null;
                              Toast.makeText(
                                  MainActivity.this,
                                  "Unable to open file picker",
                                  Toast.LENGTH_SHORT
                              ).show();
                              return false;
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void printHtml(final String html) {

                      runOnUiThread(() -> {

                          WebView printView =
                              new WebView(MainActivity.this);

                          printView.getSettings()
                              .setJavaScriptEnabled(true);

                          printView.setWebViewClient(
                              new WebViewClient() {
                                  @Override
                                  public void onPageFinished(
                                          WebView view,
                                          String url) {

                                      PrintManager manager =
                                          (PrintManager)
                                          getSystemService(
                                              Context.PRINT_SERVICE
                                          );

                                      manager.print(
                                          "Invoice Maker Document",
                                          view.createPrintDocumentAdapter(
                                              "Invoice Maker Document"
                                          ),
                                          null
                                      );
                                  }
                              }
                          );

                          printView.loadDataWithBaseURL(
                              null,
                              html,
                              "text/html",
                              "UTF-8",
                              null
                          );
                      });
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  if (requestCode == FILE_REQUEST) {

                      Uri[] result = null;

                      if (
                          resultCode == RESULT_OK &&
                          data != null &&
                          data.getData() != null
                      ) {
                          result = new Uri[]{data.getData()};
                      }

                      if (fileCallback != null) {
                          fileCallback.onReceiveValue(result);
                          fileCallback = null;
                      }

                      return;
                  }

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Invoice-Maker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
