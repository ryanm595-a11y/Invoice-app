name: Build Invoice Maker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app
          rm -f build.gradle
          rm -f settings.gradle

          mkdir -p app/src/main/java/com/invoicemaker/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "InvoiceMaker"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.invoicemaker.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.invoicemaker.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 36
                  versionName "3.3.1"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:statusBarColor">
                      #111827
                  </item>

                  <item name="android:navigationBarColor">
                      #111827
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#111827"
                  android:pathData="M0,0h108v108h-108z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M27,24h54v60h-54z" />

              <path
                  android:fillColor="#111827"
                  android:pathData="M35,35h38v6h-38zM35,48h38v6h-38zM35,61h25v6h-25z" />

          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Invoice Maker"
                  android:icon="@drawable/app_icon"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/invoicemaker/app/MainActivity.java <<'EOF'
          package com.invoicemaker.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Insets;
          import android.graphics.pdf.PdfDocument;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.FileOutputStream;
          import java.io.IOException;

          public class MainActivity extends Activity {

              private WebView webView;
              private WebView pdfWebView;

              private ValueCallback<Uri[]> fileCallback;

              private static final int FILE_REQUEST = 1001;
              private static final int PDF_REQUEST = 1002;

              private String pendingPdfHtml;
              private String pendingPdfName;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);

                  webView.setBackgroundColor(Color.WHITE);

                  if (Build.VERSION.SDK_INT >= 30) {

                      webView.setOnApplyWindowInsetsListener(
                          (v, insets) -> {

                              Insets bars =
                                  insets.getInsets(
                                      WindowInsets.Type.navigationBars()
                                  );

                              v.setPadding(
                                  0,
                                  0,
                                  0,
                                  bars.bottom
                              );

                              return insets;
                          }
                      );
                  }

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(
                      new WebViewClient()
                  );

                  webView.addJavascriptInterface(
                      new AndroidBridge(),
                      "Android"
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public boolean onShowFileChooser(

                              WebView webView,

                              ValueCallback<Uri[]>
                                  newCallback,

                              FileChooserParams params
                          ) {

                              if (fileCallback != null) {

                                  fileCallback
                                      .onReceiveValue(null);
                              }

                              fileCallback =
                                  newCallback;

                              try {

                                  startActivityForResult(
                                      params.createIntent(),
                                      FILE_REQUEST
                                  );

                                  return true;

                              } catch (Exception e) {

                                  fileCallback = null;

                                  Toast.makeText(
                                      MainActivity.this,
                                      "Unable to open file picker",
                                      Toast.LENGTH_SHORT
                                  ).show();

                                  return false;
                              }
                          }
                      }
                  );

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              public class AndroidBridge {

                  @JavascriptInterface
                  public void savePdf(

                      final String html,
                      final String suggestedName
                  ) {

                      runOnUiThread(() -> {

                          pendingPdfHtml = html;

                          pendingPdfName =
                              suggestedName;

                          if (
                              pendingPdfName == null ||
                              pendingPdfName.trim().isEmpty()
                          ) {

                              pendingPdfName =
                                  "document.pdf";
                          }

                          if (
                              !pendingPdfName
                                  .toLowerCase()
                                  .endsWith(".pdf")
                          ) {

                              pendingPdfName += ".pdf";
                          }

                          Intent intent =
                              new Intent(
                                  Intent.ACTION_CREATE_DOCUMENT
                              );

                          intent.addCategory(
                              Intent.CATEGORY_OPENABLE
                          );

                          intent.setType(
                              "application/pdf"
                          );

                          intent.putExtra(
                              Intent.EXTRA_TITLE,
                              pendingPdfName
                          );

                          startActivityForResult(
                              intent,
                              PDF_REQUEST
                          );
                      });
                  }
              }

              private void createPdf(Uri destination) {

                  if (pendingPdfHtml == null) {
                      return;
                  }

                  pdfWebView =
                      new WebView(this);

                  pdfWebView.setBackgroundColor(
                      Color.WHITE
                  );

                  WebSettings settings =
                      pdfWebView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  pdfWebView.setWebViewClient(
                      new WebViewClient() {

                          @Override
                          public void onPageFinished(
                              WebView view,
                              String url
                          ) {

                              view.postDelayed(
                                  () -> renderPdf(
                                      view,
                                      destination
                                  ),
                                  400
                              );
                          }
                      }
                  );

                  pdfWebView.loadDataWithBaseURL(
                      null,
                      pendingPdfHtml,
                      "text/html",
                      "UTF-8",
                      null
                  );
              }

              private void renderPdf(
                  WebView view,
                  Uri destination
              ) {

                  final int PAGE_WIDTH = 612;
                  final int PAGE_HEIGHT = 792;

                  int widthSpec =
                      View.MeasureSpec.makeMeasureSpec(
                          PAGE_WIDTH,
                          View.MeasureSpec.EXACTLY
                      );

                  int heightSpec =
                      View.MeasureSpec.makeMeasureSpec(
                          0,
                          View.MeasureSpec.UNSPECIFIED
                      );

                  view.measure(
                      widthSpec,
                      heightSpec
                  );

                  int contentWidth =
                      view.getMeasuredWidth();

                  int contentHeight =
                      view.getMeasuredHeight();

                  if (contentHeight < 1) {
                      contentHeight = PAGE_HEIGHT;
                  }

                  view.layout(
                      0,
                      0,
                      contentWidth,
                      contentHeight
                  );

                  float scaleX =
                      (float) PAGE_WIDTH /
                      (float) contentWidth;

                  float scaleY =
                      (float) PAGE_HEIGHT /
                      (float) contentHeight;

                  float scale =
                      Math.min(
                          scaleX,
                          scaleY
                      );

                  PdfDocument document =
                      new PdfDocument();

                  PdfDocument.PageInfo pageInfo =
                      new PdfDocument
                          .PageInfo
                          .Builder(
                              PAGE_WIDTH,
                              PAGE_HEIGHT,
                              1
                          )
                          .create();

                  PdfDocument.Page page =
                      document.startPage(
                          pageInfo
                      );

                  Canvas canvas =
                      page.getCanvas();

                  canvas.drawColor(
                      Color.WHITE
                  );

                  float scaledWidth =
                      contentWidth * scale;

                  float left =
                      Math.max(
                          0,
                          (PAGE_WIDTH - scaledWidth) / 2f
                      );

                  canvas.save();

                  canvas.translate(
                      left,
                      0
                  );

                  canvas.scale(
                      scale,
                      scale
                  );

                  view.draw(canvas);

                  canvas.restore();

                  document.finishPage(page);

                  try {

                      FileOutputStream output =
                          new FileOutputStream(
                              getContentResolver()
                                  .openFileDescriptor(
                                      destination,
                                      "w"
                                  )
                                  .getFileDescriptor()
                          );

                      document.writeTo(
                          output
                      );

                      output.flush();
                      output.close();

                      Toast.makeText(
                          this,
                          "PDF saved successfully",
                          Toast.LENGTH_LONG
                      ).show();

                  } catch (Exception e) {

                      Toast.makeText(
                          this,
                          "Could not save PDF",
                          Toast.LENGTH_LONG
                      ).show();

                  } finally {

                      document.close();

                      pdfWebView = null;

                      pendingPdfHtml = null;

                      pendingPdfName = null;
                  }
              }

              @Override
              protected void onActivityResult(

                  int requestCode,
                  int resultCode,
                  Intent data
              ) {

                  if (
                      requestCode ==
                      FILE_REQUEST
                  ) {

                      Uri[] result = null;

                      if (
                          resultCode == RESULT_OK &&
                          data != null &&
                          data.getData() != null
                      ) {

                          result =
                              new Uri[]{
                                  data.getData()
                              };
                      }

                      if (
                          fileCallback != null
                      ) {

                          fileCallback
                              .onReceiveValue(
                                  result
                              );

                          fileCallback = null;
                      }

                      return;
                  }

                  if (
                      requestCode ==
                      PDF_REQUEST
                  ) {

                      if (
                          resultCode == RESULT_OK &&
                          data != null &&
                          data.getData() != null
                      ) {

                          createPdf(
                              data.getData()
                          );

                      } else {

                          pendingPdfHtml = null;
                          pendingPdfName = null;
                      }

                      return;
                  }

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );
              }

              @Override
              public void onBackPressed() {

                  webView.evaluateJavascript(

                      "window.handleAndroidBack ? window.handleAndroidBack() : false",

                      value -> {

                          if (!"true".equals(value)) {

                              if (
                                  webView.canGoBack()
                              ) {

                                  webView.goBack();

                              } else {

                                  MainActivity.super
                                      .onBackPressed();
                              }
                          }
                      }
                  );
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Invoice-Maker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
