<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<title>Never Forget v2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#182033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}.wrap{max-width:900px;margin:auto;padding:14px 14px 90px}.top{position:sticky;top:0;z-index:10;background:#f4f6f8;padding:14px;display:flex;align-items:center;gap:10px}.brand{flex:1}.brand small{font-size:9px;font-weight:800;letter-spacing:.12em;color:#7f8897}.brand h1{margin:2px 0 0;font-size:22px}.version{font-size:10px;background:#e9edf2;padding:5px 8px;border-radius:999px;color:#596579;font-weight:700}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:750}.primary{background:#111827;color:#fff}.secondary{background:#fff;border:1px solid #d9dee6;color:#243046}
.card{background:#fff;border:1px solid #e1e5eb;border-radius:14px;margin-bottom:12px}.pad{padding:14px}.hero{background:#111827;color:#fff;border-radius:15px;padding:18px}.hero h2{margin:4px 0 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.stat{background:#fff;border:1px solid #e1e5eb;border-radius:12px;padding:12px}.stat small{color:#7c8695}.stat b{display:block;margin-top:4px}
.row{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid #eef1f4}.row:first-child{border-top:0}.grow{flex:1;min-width:0}.grow b,.grow span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grow span{font-size:11px;color:#7c8695;margin-top:3px}.amount{text-align:right}.badge{display:inline-block;margin-top:4px;font-size:9px;border-radius:999px;padding:3px 7px;background:#edf1f5}.Paid{background:#e8f6ed;color:#18743b}.Overdue{background:#fff0ee;color:#b13a31}.Sent{background:#edf4ff;color:#2b63a9}
.field{display:block;margin-bottom:12px}.field span{display:block;font-size:9px;font-weight:800;color:#6f7a8a;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d9dee6;border-radius:9px;padding:11px;background:#fff;outline:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 52px 80px 72px 28px;gap:6px;align-items:center;margin-bottom:8px}.item input{min-width:0;width:100%;border:1px solid #d9dee6;border-radius:8px;padding:9px}.item .amt{text-align:right;font-size:11px;font-weight:800}.x{border:0;background:transparent;font-size:20px;color:#7d8797}
.sum{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;color:#667185}.sum.total{border-top:1px solid #e4e8ed;margin-top:7px;padding-top:12px;font-size:17px;color:#111827}
.logoBox{display:flex;gap:12px;align-items:center;margin-bottom:14px}.logoPreview{width:84px;height:84px;border:1px dashed #cbd2dc;border-radius:12px;background:#f8f9fb;display:grid;place-items:center;overflow:hidden}.logoPreview img{width:100%;height:100%;object-fit:contain}.logoPreview span{font-size:10px;color:#7c8695;text-align:center}.helper{font-size:11px;color:#7c8695;margin:4px 0 8px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid #dfe3e9;display:flex;z-index:20}.bottom button{flex:1;border:0;background:transparent;color:#8490a1;font-size:9px;font-weight:750}.bottom button.active{color:#111827}.editbar{position:sticky;top:0;z-index:15;background:#fff;border-bottom:1px solid #e1e5eb;padding:10px 12px;display:flex;gap:8px;align-items:center}.editbar .push{margin-left:auto}.note{font-size:11px;color:#687386;background:#f0f3f6;padding:10px;border-radius:9px;margin-top:10px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.item{grid-template-columns:minmax(0,1fr) 46px 72px 62px 24px}.item input{font-size:12px;padding:8px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
const APP_VERSION="2.0.0";
const KEY="never_forget_v2";
const defaults={settings:{businessName:"Your Business",owner:"",email:"",phone:"",address:"",currency:"USD",prefix:"INV",logo:""},clients:[],invoices:[]};

function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||"{}");
    const d=Object.assign(clone(defaults),raw);
    d.settings=Object.assign({},defaults.settings,raw.settings||{});
    d.clients=Array.isArray(raw.clients)?raw.clients:[];
    d.invoices=Array.isArray(raw.invoices)?raw.invoices:[];
    return d;
  }catch(e){return clone(defaults)}
}
let db=load(), page="home", editing=null;
const app=document.getElementById("app");
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function num(v){const n=parseFloat(String(v).replace(/[^0-9.-]/g,""));return isFinite(n)?n:0}
function money(v){try{return new Intl.NumberFormat(undefined,{style:"currency",currency:db.settings.currency||"USD"}).format(num(v))}catch(e){return "$"+num(v).toFixed(2)}}
function today(){return new Date().toISOString().slice(0,10)}
function totals(inv){const sub=(inv.items||[]).reduce((s,x)=>s+num(x.qty)*num(x.rate),0),disc=num(inv.discount),base=Math.max(0,sub-disc),tax=base*num(inv.tax)/100;return{sub,disc,tax,total:base+tax}}
function nextNo(){return (db.settings.prefix||"INV")+"-"+String(db.invoices.length+1).padStart(4,"0")}
function top(title){return `<div class="top"><div class="brand"><small>NEVER FORGET</small><h1>${esc(title)}</h1></div><span class="version">v${APP_VERSION}</span>${page!=="settings"?'<button class="btn primary" id="newInv">＋ Invoice</button>':""}</div>`}
function nav(){return `<div class="bottom">${[["home","Home"],["invoices","Invoices"],["clients","Clients"],["settings","Settings"]].map(x=>`<button data-nav="${x[0]}" class="${page===x[0]?"active":""}">${x[1]}</button>`).join("")}</div>`}
function field(label,id,value,type="text"){return `<label class="field"><span>${esc(label)}</span><input id="${id}" type="${type}" value="${esc(value)}"></label>`}
function row(i){const t=totals(i);return `<div class="row" data-open="${i.id}"><div class="grow"><b>${esc(i.number)}</b><span>${esc(i.clientName||"No client")}</span></div><div class="amount"><b>${money(t.total)}</b><div class="badge ${esc(i.status)}">${esc(i.status)}</div></div></div>`}
function home(){
 const s=db.invoices.reduce((a,i)=>{const t=totals(i);a.all+=t.total;if(i.status==="Paid")a.paid+=t.total;else if(i.status!=="Cancelled")a.out+=t.total;return a},{all:0,paid:0,out:0});
 return top("Dashboard")+`<main class="wrap"><section class="hero"><small>YOUR INVOICE WORKSPACE</small><h2>Simple invoicing and records.</h2></section><section class="stats"><div class="stat"><small>Invoiced</small><b>${money(s.all)}</b></div><div class="stat"><small>Paid</small><b>${money(s.paid)}</b></div><div class="stat"><small>Outstanding</small><b>${money(s.out)}</b></div><div class="stat"><small>Clients</small><b>${db.clients.length}</b></div></section><section class="card"><div class="pad"><b>Recent invoices</b></div>${db.invoices.length?db.invoices.slice(0,8).map(row).join(""):'<div class="pad helper">No invoices yet.</div>'}</section></main>`+nav()
}
function invoices(){return top("Invoices")+`<main class="wrap"><section class="card"><div class="pad"><b>All invoices</b></div>${db.invoices.length?db.invoices.map(row).join(""):'<div class="pad helper">No invoices yet.</div>'}</section></main>`+nav()}
function clients(){
 return top("Clients")+`<main class="wrap"><section class="card pad">${field("Client name","cname","")}${field("Email","cemail","")}${field("Phone","cphone","")}<button class="btn primary" id="addClient">Add client</button></section><section class="card"><div class="pad"><b>Saved clients</b></div>${db.clients.length?db.clients.map(c=>`<div class="row"><div class="grow"><b>${esc(c.name)}</b><span>${esc(c.email||"")}${c.phone?" · "+esc(c.phone):""}</span></div><button class="x" data-delclient="${c.id}">×</button></div>`).join(""):'<div class="pad helper">No clients yet.</div>'}</section></main>`+nav()
}
function settings(){
 const logo=db.settings.logo?`<img src="${esc(db.settings.logo)}" alt="Logo">`:`<span>No logo<br>selected</span>`;
 return top("Settings")+`<main class="wrap"><section class="card pad"><div class="logoBox"><div class="logoPreview">${logo}</div><div class="grow"><b>Business logo</b><div class="helper">Tap below to choose a PNG, JPG or WebP from your phone.</div><label class="btn secondary" style="display:inline-block">Choose logo<input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp" style="display:none"></label> <button class="btn secondary" id="removeLogo" type="button">Remove</button></div></div>${field("Business name","businessName",db.settings.businessName)}${field("Contact name","owner",db.settings.owner)}${field("Email","email",db.settings.email)}${field("Phone","phone",db.settings.phone)}${field("Invoice prefix","prefix",db.settings.prefix)}<label class="field"><span>Currency</span><select id="currency">${["USD","CAD","GBP","EUR","AUD"].map(c=>`<option ${db.settings.currency===c?"selected":""}>${c}</option>`).join("")}</select></label><label class="field"><span>Address</span><textarea id="address" rows="4">${esc(db.settings.address)}</textarea></label><button class="btn primary" id="saveSettings">Save settings</button><div class="note">Logo and invoice data are stored locally in this browser.</div></section></main>`+nav()
}
function newInvoice(){const i={id:id(),number:nextNo(),clientName:"",clientEmail:"",issueDate:today(),dueDate:today(),status:"Draft",items:[{id:id(),description:"",qty:"1",rate:""}],discount:"0",tax:"0",notes:"Thank you for your business."};db.invoices.unshift(i);save();editing=i.id;render()}
function editor(){
 const i=db.invoices.find(x=>x.id===editing);if(!i){editing=null;return render()}
 const t=totals(i);
 return `<div class="editbar"><button class="btn secondary" id="back">‹ Back</button><b>${esc(i.number)}</b><span class="version">v${APP_VERSION}</span><button class="btn primary push" id="saveInv">Save</button></div><main class="wrap"><section class="card pad"><div class="grid">${field("Invoice number","number",i.number)}<label class="field"><span>Status</span><select id="status">${["Draft","Sent","Paid","Overdue","Cancelled"].map(s=>`<option ${i.status===s?"selected":""}>${s}</option>`).join("")}</select></label>${field("Issue date","issueDate",i.issueDate,"date")}${field("Due date","dueDate",i.dueDate,"date")}</div>${field("Client name","clientName",i.clientName)}${field("Client email","clientEmail",i.clientEmail)}<div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0"><b>Items</b><button class="btn secondary" id="addItem">＋ Add item</button></div><div id="items">${i.items.map(x=>`<div class="item" data-row="${x.id}"><input data-item="${x.id}" data-key="description" value="${esc(x.description)}" placeholder="Description"><input inputmode="decimal" data-item="${x.id}" data-key="qty" value="${esc(x.qty)}" placeholder="Qty"><input inputmode="decimal" data-item="${x.id}" data-key="rate" value="${esc(x.rate)}" placeholder="Rate"><span class="amt">${money(num(x.qty)*num(x.rate))}</span><button class="x" data-remove="${x.id}">×</button></div>`).join("")}</div><div class="grid"><label class="field"><span>Discount</span><input id="discount" inputmode="decimal" value="${esc(i.discount)}"></label><label class="field"><span>Tax %</span><input id="tax" inputmode="decimal" value="${esc(i.tax)}"></label></div><label class="field"><span>Notes</span><textarea id="notes" rows="4">${esc(i.notes)}</textarea></label></section><section class="card pad" id="summary"><div class="sum"><span>Subtotal</span><b data-sum="sub">${money(t.sub)}</b></div><div class="sum"><span>Discount</span><b data-sum="disc">-${money(t.disc)}</b></div><div class="sum"><span>Tax</span><b data-sum="tax">${money(t.tax)}</b></div><div class="sum total"><span>Total</span><b data-sum="total">${money(t.total)}</b></div></section></main>`
}
function syncEditor(){
 const i=db.invoices.find(x=>x.id===editing);if(!i)return;
 ["number","status","issueDate","dueDate","clientName","clientEmail","discount","tax","notes"].forEach(k=>{const e=document.getElementById(k);if(e)i[k]=e.value});
 save()
}
function updateSummary(){
 const i=db.invoices.find(x=>x.id===editing);if(!i)return;const t=totals(i);
 const m={sub:money(t.sub),disc:"-"+money(t.disc),tax:money(t.tax),total:money(t.total)};
 Object.keys(m).forEach(k=>{const e=document.querySelector(`[data-sum="${k}"]`);if(e)e.textContent=m[k]})
}
function bind(){
 document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{page=b.dataset.nav;editing=null;render()});
 const ni=document.getElementById("newInv");if(ni)ni.onclick=newInvoice;
 document.querySelectorAll("[data-open]").forEach(r=>r.onclick=()=>{editing=r.dataset.open;render()});
 const ac=document.getElementById("addClient");if(ac)ac.onclick=()=>{const name=document.getElementById("cname").value.trim();if(!name)return alert("Enter a client name.");db.clients.unshift({id:id(),name,email:document.getElementById("cemail").value.trim(),phone:document.getElementById("cphone").value.trim()});save();render()};
 document.querySelectorAll("[data-delclient]").forEach(b=>b.onclick=()=>{db.clients=db.clients.filter(c=>c.id!==b.dataset.delclient);save();render()});
 const lf=document.getElementById("logoFile");if(lf)lf.onchange=()=>{const f=lf.files&&lf.files[0];if(!f)return;if(f.size>2500000){alert("Please choose an image under 2.5 MB.");return}const r=new FileReader();r.onload=()=>{db.settings.logo=r.result;save();render()};r.readAsDataURL(f)};
 const rl=document.getElementById("removeLogo");if(rl)rl.onclick=()=>{db.settings.logo="";save();render()};
 const ss=document.getElementById("saveSettings");if(ss)ss.onclick=()=>{["businessName","owner","email","phone","prefix"].forEach(k=>db.settings[k]=document.getElementById(k).value);db.settings.currency=document.getElementById("currency").value;db.settings.address=document.getElementById("address").value;save();alert("Saved.")};
 const bk=document.getElementById("back");if(bk)bk.onclick=()=>{syncEditor();editing=null;page="invoices";render()};
 const sv=document.getElementById("saveInv");if(sv)sv.onclick=()=>{syncEditor();editing=null;page="invoices";render()};
 const ai=document.getElementById("addItem");if(ai)ai.onclick=()=>{syncEditor();const i=db.invoices.find(x=>x.id===editing);i.items.push({id:id(),description:"",qty:"1",rate:""});save();render()};
 document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{syncEditor();const i=db.invoices.find(x=>x.id===editing);if(i.items.length>1)i.items=i.items.filter(x=>x.id!==b.dataset.remove);save();render()});
 // CRITICAL: item typing updates data and totals IN PLACE. It never calls render().
 document.querySelectorAll("[data-item]").forEach(el=>{
   el.addEventListener("input",()=>{
     const i=db.invoices.find(x=>x.id===editing);if(!i)return;
     const item=i.items.find(x=>x.id===el.dataset.item);if(!item)return;
     item[el.dataset.key]=el.value;
     const row=el.closest("[data-row]");
     if(row){const amt=row.querySelector(".amt");if(amt)amt.textContent=money(num(item.qty)*num(item.rate))}
     updateSummary();save();
   });
 });
 ["discount","tax"].forEach(k=>{const e=document.getElementById(k);if(e)e.addEventListener("input",()=>{const i=db.invoices.find(x=>x.id===editing);if(!i)return;i[k]=e.value;updateSummary();save()})});
}
function render(){app.innerHTML=editing?editor():page==="home"?home():page==="invoices"?invoices():page==="clients"?clients():settings();bind()}
render();
})();
</script>
</body>
</html>
