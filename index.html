<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Invoice Record</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f8fa;color:#182131}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.nav{display:none}.top{padding:18px 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#f7f8fa;z-index:5}.top small{font-size:9px;letter-spacing:.12em;font-weight:800;color:#8993a5}.top h1{font-size:23px;letter-spacing:-.04em;margin:4px 0 0}.new,.save{margin-left:auto;background:#111827;color:#fff;border-radius:9px;padding:10px 13px;font-weight:750;display:flex;align-items:center;gap:7px}.page{padding:0 13px 78px;max-width:900px;margin:auto}.welcome{background:#111827;color:#fff;border-radius:15px;padding:19px;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}.welcome span{font-size:10px;color:#aeb7c6}.welcome h2{font-size:18px;margin:5px 0 0}.quick{background:#fff;color:#111827;border-radius:8px;padding:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:13px}.stat,.card{background:#fff;border:1px solid #e4e7ed;border-radius:13px}.stat{padding:12px 10px;display:flex;align-items:center;gap:9px}.stat i{width:34px;height:34px;background:#f0f2f5;border-radius:9px;display:grid;place-items:center;font-style:normal}.stat small{display:block;color:#7d8798;font-size:10px}.stat b{display:block;font-size:15px;margin-top:3px}.section{padding:15px;display:flex;justify-content:space-between;align-items:center}.section h3{margin:0;font-size:15px}.section p{margin:4px 0 0;color:#7d8798;font-size:11px}.rows{border-top:1px solid #edf0f4}.row{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid #edf0f4;min-height:68px;cursor:pointer}.row:last-child{border-bottom:0}.icon{width:37px;height:37px;background:#f0f2f5;border-radius:9px;display:grid;place-items:center;flex:none}.main{min-width:0;flex:1}.main b,.main span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main b{font-size:13px}.main span{font-size:11px;color:#7c8697;margin-top:3px}.amount{text-align:right}.amount b{display:block;font-size:12px}.badge{display:inline-block;font-size:8px;text-transform:uppercase;font-weight:800;padding:3px 7px;border-radius:20px;background:#eef1f5;color:#687386;margin-top:4px}.paid{background:#e8f6ed;color:#18743b}.overdue{background:#fff0ee;color:#b13a31}.sent{background:#edf4ff;color:#2b63a9}.search{height:45px;background:#fff;border:1px solid #e1e5eb;border-radius:10px;display:flex;align-items:center;padding:0 12px;margin-bottom:12px}.search input{border:0;outline:0;width:100%;font-size:13px}.empty{text-align:center;padding:55px 18px}.empty .big{font-size:28px}.empty p{color:#7c8697;font-size:12px}.form{padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:block;margin-bottom:12px}.field span{display:block;text-transform:uppercase;font-size:9px;letter-spacing:.07em;font-weight:800;color:#727d8e;margin-bottom:6px}.field input,.field select,.field textarea,.item input{width:100%;border:1px solid #dce1e8;border-radius:8px;padding:10px;background:#fff;outline:0}.sep{height:1px;background:#edf0f4;margin:7px 0 18px}.outline{background:#fff;border:1px solid #dce1e8;color:#3e4a5c;border-radius:8px;padding:8px 10px;font-weight:700}.item{display:grid;grid-template-columns:minmax(0,1fr) 54px 76px 75px 20px;gap:5px;align-items:center;margin-bottom:8px}.item b{font-size:10px;text-align:right}.x{background:transparent;color:#7d8797}.summary{margin-top:12px;padding:15px}.line{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;color:#687386}.total{border-top:1px solid #e3e7ed;margin-top:8px;padding-top:12px;font-size:17px;color:#111827}.bottom{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid #e2e6ec;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}.bottom button{flex:1;background:transparent;color:#8490a1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px;font-weight:700}.bottom .on{color:#111827}.modal{position:fixed;inset:0;background:#0006;z-index:30;display:grid;align-items:end}.box{background:#fff;border-radius:16px 16px 0 0;padding:18px;max-height:80vh;overflow:auto}.client{display:flex;align-items:center;gap:10px;width:100%;padding:11px;border:1px solid #edf0f4;background:#fff;border-radius:9px;margin-bottom:6px;text-align:left}.avatar{width:34px;height:34px;border-radius:50%;background:#edf0f4;display:grid;place-items:center;font-weight:800}.client span{flex:1}.client small{display:block;color:#7d8797;margin-top:2px}.wide{width:100%;justify-content:center;margin-top:5px}.editorTitle{display:flex;align-items:center;padding:11px 13px;background:#fff;border-bottom:1px solid #e4e7ed;position:sticky;top:0;z-index:8}.back{background:transparent;color:#657084;padding:6px}.mobileSave{position:fixed;bottom:64px;left:0;right:0;padding:9px 13px;background:#fffffff5;border-top:1px solid #e3e7ed;z-index:15}.mobileSave button{width:100%;justify-content:center}.desktopOnly{display:none}
@media(min-width:800px){.nav{display:block;position:fixed;inset:0 auto 0 0;width:235px;background:#111827;color:#fff;padding:25px 14px}.nav h2{font-size:16px;margin:0 10px 28px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#9da8ba;padding:11px;border-radius:8px;margin:3px 0}.nav button.on,.nav button:hover{background:#202938;color:#fff}.bottom{display:none}.page,.top{margin-left:235px}.top{padding:28px 36px}.page{padding:0 36px 40px}.mobileOnly{display:none}.desktopOnly{display:block}.stats{grid-template-columns:repeat(4,1fr)}.editorTitle{margin-left:235px}.editorPage{margin-left:235px;padding:24px 36px}.mobileSave{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.2/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2), today=()=>new Date().toISOString().slice(0,10);
const money=(n,c)=>{try{return new Intl.NumberFormat(undefined,{style:"currency",currency:c}).format(Number(n)||0)}catch{return"$"+(Number(n)||0).toFixed(2)}};
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let invoices=get("invoice_record_invoices",[]),clients=get("invoice_record_clients",[]),settings=Object.assign({businessName:"Your Business",owner:"",email:"",phone:"",address:"",currency:"USD",invoicePrefix:"INV"},get("invoice_record_settings",{})),page="dashboard",editing=null;
function render(){document.body.innerHTML=editing?editorHTML():appHTML();wire()}
function nav(){return `<nav class="nav"><h2>▣ Invoice Record</h2><button class="${page==="dashboard"?"on":""}" data-page="dashboard">⌂ &nbsp; Dashboard</button><button class="${page==="invoices"?"on":""}" data-page="invoices">▤ &nbsp; Invoices</button><button class="${page==="clients"?"on":""}" data-page="clients">♙ &nbsp; Clients</button><button class="${page==="settings"?"on":""}" data-page="settings">⚙ &nbsp; Settings</button></nav>`}
function bottom(){return `<nav class="bottom">${[["dashboard","⌂","Home"],["invoices","▤","Invoices"],["clients","♙","Clients"],["settings","⚙","Settings"]].map(x=>`<button class="${page===x[0]?"on":""}" data-page="${x[0]}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join("")}</nav>`}
function appHTML(){let titles={dashboard:"Dashboard",invoices:"Invoices",clients:"Clients",settings:"Business settings"};return `${nav()}<header class="top"><div><small>${page==="dashboard"?"OVERVIEW":page.toUpperCase()}</small><h1>${titles[page]}</h1></div><button class="new" id="new">＋ <span>New invoice</span></button></header>${page==="dashboard"?dash():page==="invoices"?invoicePage():page==="clients"?clientPage():settingsPage()}${bottom()}`}
function stats(){let t=invoices.reduce((a,i)=>a+i.total,0),p=invoices.filter(i=>i.status==="Paid").reduce((a,i)=>a+i.total,0),o=invoices.filter(i=>!["Paid","Cancelled"].includes(i.status)).reduce((a,i)=>a+i.total,0),d=invoices.filter(i=>i.status==="Overdue").reduce((a,i)=>a+i.total,0);return `<div class="stats"><div class="stat"><i>▤</i><div><small>Invoiced</small><b>${money(t,settings.currency)}</b></div></div><div class="stat"><i>✓</i><div><small>Paid</small><b>${money(p,settings.currency)}</b></div></div><div class="stat"><i>◷</i><div><small>Outstanding</small><b>${money(o,settings.currency)}</b></div></div><div class="stat"><i>!</i><div><small>Overdue</small><b>${money(d,settings.currency)}</b></div></div></div>`}
function row(i){return `<div class="row" data-edit="${i.id}"><div class="icon">▤</div><div class="main"><b>${i.number}</b><span>${i.clientName||"No client"}</span></div><div class="amount"><b>${money(i.total,settings.currency)}</b><span class="badge ${i.status.toLowerCase()}">${i.status}</span></div><button class="x" data-pdf="${i.id}" onclick="event.stopPropagation()">↓</button></div>`}
function dash(){return `<div class="page"><div class="welcome"><div><span>YOUR INVOICE WORKSPACE</span><h2>Keep your books simple.</h2></div><button class="quick" id="new">＋ Invoice</button></div>${stats()}<section class="card"><div class="section"><div><h3>Recent invoices</h3><p>Your latest records</p></div></div><div class="rows">${invoices.length?invoices.slice(0,8).map(row).join(""):`<div class="empty"><div class="big">▣</div><h3>No invoices yet</h3><p>Create your first invoice and it will appear here.</p><button class="new" id="new">＋ Create invoice</button></div>`}</div></section></div>`}
function invoicePage(){let q=window.search||"";let arr=invoices.filter(i=>`${i.number} ${i.clientName} ${i.status}`.toLowerCase().includes(q.toLowerCase()));return `<div class="page"><div class="search">⌕ <input id="search" value="${q.replaceAll('"','&quot;')}" placeholder="Search invoices or clients"></div><section class="card"><div class="rows">${arr.length?arr.map(row).join(""):`<div class="empty"><h3>No matching invoices</h3><p>Try another search.</p></div>`}</div></section></div>`}
function clientPage(){return `<div class="page"><section class="card form"><div class="section"><div><h3>New client</h3><p>Save customer details once.</p></div></div><label class="field"><span>Name</span><input id="cn" placeholder="Customer or company"></label><label class="field"><span>Email</span><input id="ce" placeholder="email@example.com"></label><label class="field"><span>Phone</span><input id="cp" placeholder="Phone"></label><button class="save wide" id="addClient">＋ Add client</button></section><section class="card" style="margin-top:12px"><div class="section"><div><h3>Clients</h3><p>${clients.length} saved</p></div></div><div class="rows">${clients.map(c=>`<div class="row"><div class="avatar">${c.name[0]}</div><div class="main"><b>${c.name}</b><span>${c.email||"No email"}${c.phone?" · "+c.phone:""}</span></div><button class="x" data-delclient="${c.id}">×</button></div>`).join("")||`<div class="empty"><p>No clients yet.</p></div>`}</div></section></div>`}
function settingsPage(){return `<div class="page"><section class="card form"><div class="section"><div><h3>Business profile</h3><p>Appears on generated PDF invoices.</p></div><button class="save" id="saveSettings">Save</button></div>${field("Business name","businessName")}${field("Contact name","owner")}${field("Email","email")}${field("Phone","phone")}${field("Currency","currency",`<select id="currency"><option>USD</option><option>CAD</option><option>GBP</option><option>EUR</option><option>AUD</option></select>`)}${field("Invoice prefix","invoicePrefix")}<label class="field"><span>Business address</span><textarea id="address" rows="4">${settings.address}</textarea></label><div class="privacy">✓ &nbsp; Records are stored locally in this browser. No payment processor or account is required.</div></section></div>`}
function field(label,key,custom){return `<label class="field"><span>${label}</span>${custom||`<input id="${key}" value="${String(settings[key]||"").replaceAll('"','&quot;')}">`}</label>`}
function editorHTML(){let f=editing,sub=f.items.reduce((a,x)=>a+(+x.qty||0)*(+x.rate||0),0),disc=+f.discount||0,taxable=Math.max(0,sub-disc),tax=taxable*(+f.tax||0)/100,total=taxable+tax;return `<div class="editorTitle"><button class="back" id="back">‹ Back</button><div><small>EDITING</small><h1>${f.number}</h1></div><button class="save" id="saveInv">Save</button></div><div class="editorPage"><section class="card form"><div class="grid">${fieldE("Invoice number","number",f.number)}${fieldE("Status","status",f.status,`<select id="status">${["Draft","Sent","Paid","Overdue","Cancelled"].map(x=>`<option ${x===f.status?"selected":""}>${x}</option>`).join("")}</select>`)}${fieldE("Issue date","issueDate",f.issueDate,'date')}${fieldE("Due date","dueDate",f.dueDate,'date')}</div><div class="sep"></div><div class="section" style="padding:0 0 14px"><div><h3>Client</h3><p>${f.clientName||"Who is this invoice for?"}</p></div><button class="outline" id="pick">Choose</button></div><div class="grid">${fieldE("Client name","clientName",f.clientName)}${fieldE("Email","clientEmail",f.clientEmail)}</div><div class="sep"></div><div class="section" style="padding:0 0 14px"><div><h3>Items</h3><p>Products or services</p></div><button class="outline" id="addItem">＋ Add item</button></div>${f.items.map(x=>`<div class="item"><input data-item="${x.id}" data-k="description" value="${String(x.description||"").replaceAll('"','&quot;')}" placeholder="Description"><input data-item="${x.id}" data-k="qty" type="number" min="0" value="${x.qty}"><input data-item="${x.id}" data-k="rate" type="number" min="0" step=".01" value="${x.rate}"><b>${money((+x.qty||0)*(+x.rate||0),settings.currency)}</b><button class="x" data-remove="${x.id}">×</button></div>`).join("")}<div class="grid">${fieldE("Discount","discount",f.discount,'number')}${fieldE("Tax %","tax",f.tax,'number')}</div><label class="field"><span>Notes</span><textarea id="notes" rows="4">${f.notes||""}</textarea></label></section><section class="card summary"><div class="line"><span>Subtotal</span><b>${money(sub,settings.currency)}</b></div><div class="line"><span>Discount</span><b>-${money(disc,settings.currency)}</b></div><div class="line"><span>Tax</span><b>${money(tax,settings.currency)}</b></div><div class="line total"><span>Total</span><b>${money(total,settings.currency)}</b></div></section></div><div class="mobileSave"><button class="save" id="saveInv2">✓ Save invoice</button></div>${pickModal()}`}
function fieldE(l,k,v,typeOrCustom){let c=typeof typeOrCustom==="string"&&typeOrCustom.startsWith("<");return `<label class="field"><span>${l}</span>${c?typeOrCustom:`<input id="${k}" ${typeOrCustom==="date"?"type=date":typeOrCustom==="number"?"type=number":""} value="${String(v??"").replaceAll('"','&quot;')}"></label>`}
function pickModal(){return `<div id="modal" class="modal" style="display:none"><div class="box"><div class="section" style="padding:0 0 15px"><div><h3>Choose client</h3><p>Select a saved customer.</p></div><button class="x" id="closeModal">×</button></div>${clients.map(c=>`<button class="client" data-pick="${c.id}"><div class="avatar">${c.name[0]}</div><span><b>${c.name}</b><small>${c.email||"No email"}</small></span>›</button>`).join("")||"<p>No saved clients.</p>"}<button class="outline wide" id="newClientFromPicker">＋ New client</button></div></div>`}
function wire(){document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;editing=null;render()});$("#new")?.addEventListener("click",newInvoice);document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editing=invoices.find(x=>x.id===b.dataset.edit);render()});document.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=()=>makePDF(invoices.find(x=>x.id===b.dataset.pdf)));$("#search")?.addEventListener("input",e=>{window.search=e.target.value;render();let s=$("#search");s?.focus();s?.setSelectionRange(s.value.length,s.value.length)});$("#addClient")?.addEventListener("click",()=>{let n=$("#cn").value.trim();if(!n)return;clients.unshift({id:uid(),name:n,email:$("#ce").value,phone:$("#cp").value});put("invoice_record_clients",clients);render()});document.querySelectorAll("[data-delclient]").forEach(b=>b.onclick=()=>{if(confirm("Delete this client?")){clients=clients.filter(c=>c.id!==b.dataset.delclient);put("invoice_record_clients",clients);render()}});$("#saveSettings")?.addEventListener("click",()=>{["businessName","owner","email","phone","invoicePrefix"].forEach(k=>settings[k]=$("#"+k).value);settings.currency=$("#currency").value;settings.address=$("#address").value;put("invoice_record_settings",settings);alert("Settings saved");render()});$("#currency")?.setAttribute("value",settings.currency);$("#back")?.addEventListener("click",()=>{editing=null;render()});$("#saveInv")?.addEventListener("click",saveEditing);$("#saveInv2")?.addEventListener("click",saveEditing);$("#addItem")?.addEventListener("click",()=>{editing.items.push({id:uid(),description:"",qty:1,rate:0});render()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{if(editing.items.length>1){editing.items=editing.items.filter(x=>x.id!==b.dataset.remove);render()}});document.querySelectorAll("[data-item]").forEach(i=>i.oninput=()=>{let x=editing.items.find(a=>a.id===i.dataset.item);x[i.dataset.k]=i.value;render();});$("#pick")?.addEventListener("click",()=>$("#modal").style.display="grid");$("#closeModal")?.addEventListener("click",()=>$("#modal").style.display="none");document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{let c=clients.find(x=>x.id===b.dataset.pick);editing.clientId=c.id;editing.clientName=c.name;editing.clientEmail=c.email||"";$("#modal").style.display="none";render()});$("#newClientFromPicker")?.addEventListener("click",()=>{editing=null;page="clients";render()})}
function newInvoice(){editing={id:uid(),number:`${settings.invoicePrefix}-${String(invoices.length+1).padStart(4,"0")}`,clientId:"",clientName:"",clientEmail:"",issueDate:today(),dueDate:today(),status:"Draft",notes:"Thank you for your business.",items:[{id:uid(),description:"",qty:1,rate:0}],discount:0,tax:0};render()}
function saveEditing(){let f=editing;f.number=$("#number").value;f.status=$("#status").value;f.issueDate=$("#issueDate").value;f.dueDate=$("#dueDate").value;f.clientName=$("#clientName").value;f.clientEmail=$("#clientEmail").value;f.discount=$("#discount").value;f.tax=$("#tax").value;f.notes=$("#notes").value;let sub=f.items.reduce((a,x)=>a+(+x.qty||0)*(+x.rate||0),0),disc=+f.discount||0,taxable=Math.max(0,sub-disc),tax=taxable*(+f.tax||0)/100;f.subtotal=sub;f.taxAmount=tax;f.total=taxable+tax;let ix=invoices.findIndex(x=>x.id===f.id);if(ix>=0)invoices[ix]=f;else invoices.unshift(f);put("invoice_record_invoices",invoices);editing=null;page="invoices";render()}
function makePDF(i){if(!window.jspdf){alert("PDF library is still loading. Try again in a moment.");return}let d=new jspdf.jsPDF(),c=settings.currency;d.setFont("helvetica","bold");d.setFontSize(22);d.text(settings.businessName||"Your Business",20,24);d.setFont("helvetica","normal");d.setFontSize(10);d.text([settings.owner,settings.address,settings.phone,settings.email].filter(Boolean).join(" • "),20,31);d.setFont("helvetica","bold");d.setFontSize(20);d.text("INVOICE",150,24);d.setFontSize(10);d.setFont("helvetica","normal");d.text(i.number,150,31);d.text("Issued: "+i.issueDate,150,37);d.text("Due: "+i.dueDate,150,43);d.line(20,50,190,50);d.setFont("helvetica","bold");d.text("BILL TO",20,62);d.setFont("helvetica","normal");d.text(i.clientName||"Client",20,69);let y=92;d.setFont("helvetica","bold");d.text("Description",20,y);d.text("Qty",125,y);d.text("Rate",145,y);d.text("Amount",170,y);d.setFont("helvetica","normal");y+=8;i.items.forEach(x=>{d.text(String(x.description||"").slice(0,55),20,y);d.text(String(x.qty),125,y);d.text(money(x.rate,c),145,y);d.text(money((+x.qty||0)*(+x.rate||0),c),170,y);y+=8});y+=8;d.line(120,y-4,190,y-4);d.text("Subtotal",145,y);d.text(money(i.subtotal,c),170,y);y+=8;if(i.discount){d.text("Discount",145,y);d.text("-"+money(i.discount,c),170,y);y+=8}if(i.tax){d.text("Tax ("+i.tax+"%)",145,y);d.text(money(i.taxAmount,c),170,y);y+=8}d.setFont("helvetica","bold");d.setFontSize(13);d.text("TOTAL",145,y+5);d.text(money(i.total,c),170,y+5);d.save(i.number+".pdf")}
render();
</script>
</body>
</html>
